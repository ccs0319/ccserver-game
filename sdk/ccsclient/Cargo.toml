[package]
name = "ccsclient"
version = "0.1.0"
edition = "2024"
description = "Cross-platform client protocol library for ccserver (framing + codec; transport provided by the host)"
license = "MIT"
publish = false

# Standalone crate: opt out of the server workspace so it builds independently
# and for targets the server workspace doesn't.
[workspace]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

# Example needs the WebSocket transport + JSON payload helpers.
[[example]]
name = "ws_client"
required-features = ["ws", "json"]

[features]
default = ["std"]
# `std` is required for the native TCP transport and for Vec/String conveniences.
std = []
# Native TCP transport (macOS / Windows / iOS / Android desktop & mobile).
native = ["std"]
# WebAssembly exports for hosts that own the socket (e.g. WeChat mini-game JS).
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
# JSON payload helpers (serde). Protobuf users bring their own prost types and
# pass the encoded bytes as the opaque payload.
json = ["dep:serde", "dep:serde_json"]
# Native WebSocket transport (wss via rustls).
ws = ["dep:tungstenite"]
# Protobuf payload example (prost derive; no protoc needed).
proto = ["dep:prost"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tungstenite = { version = "0.29", optional = true, default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
prost = { version = "0.13", optional = true }
